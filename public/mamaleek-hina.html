<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>مماليك حيّنا 3D</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102b25;color:white;font-family:system-ui,'Segoe UI',sans-serif;touch-action:none}#scene{position:fixed;inset:0}canvas{display:block}.hud{position:absolute;background:#082c29c9;border:1px solid #b8d9c744;backdrop-filter:blur(12px);border-radius:16px;padding:9px 13px;box-shadow:0 8px 25px #0003}.top{top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center}.quest{top:76px;right:12px;font-size:12px}.quest b{color:#f5ce65}.tools{position:absolute;right:12px;top:170px;display:grid;gap:7px}.tools button,.actions button,.slot{border:1px solid #c3dfc655;background:#0c3934df;color:white;border-radius:13px;padding:10px;font-size:18px}.tools button{width:48px;height:48px}.bottom{position:absolute;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end}.stick{width:100px;height:100px;border-radius:50%;background:#d9eddb55;border:2px solid #d9eddb99;display:grid;place-items:center}.knob{width:40px;height:40px;border-radius:50%;background:#fffddd}.bar{display:flex;gap:5px;padding:6px}.slot{width:43px;height:45px;padding:0}.slot.active{outline:2px solid #ffd45b}.actions{display:grid;grid-template-columns:repeat(2,45px);gap:5px}.actions button{height:43px;padding:0}.toast{bottom:125px;left:50%;transform:translateX(-50%);opacity:0;transition:.2s;white-space:nowrap;font-size:12px}button{cursor:pointer}
</style></head><body><div id="scene"></div><div class="hud top"><b>🏰 مماليك حيّنا <small style="color:#9de3c2">3D</small></b><span>🪙 <i id="gold">120</i>　🪵 <i id="wood">0</i>　❤️ <i id="hp">100</i></span></div><div class="hud quest"><b>📜 المهمة</b><br><span id="mission">اجمع 5 وحدات خشب</span><br><small id="progress">0 / 5</small></div><div class="tools"><button onclick="choose('sword')">⚔️</button><button onclick="choose('axe')">🪓</button><button onclick="choose('bow')">🏹</button><button onclick="zoom(1)">＋</button><button onclick="zoom(-1)">－</button><button onclick="toggleHud()">👁️</button></div><div class="bottom"><div class="stick" id="stick"><div class="knob" id="knob"></div></div><div class="hud bar"><button class="slot active" onclick="choose('sword')">⚔️</button><button class="slot" onclick="choose('axe')">🪓</button><button class="slot" onclick="choose('bow')">🏹</button><button class="slot" onclick="choose('potion')">🧪</button></div><div class="actions"><button onclick="attack()">🗡️</button><button onclick="interact()">✋</button><button onclick="jump()">⬆️</button><button onclick="toggleRun()">🏃</button></div></div><div id="toast" class="hud toast"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8bc8e5);scene.fog=new THREE.Fog(0x8bc8e5,35,110);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,250);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.querySelector('#scene').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe2f6ff,0x58613a,2));const sun=new THREE.DirectionalLight(0xffefcf,3);sun.position.set(-20,35,15);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.9}), grass=M(0x8fa85f),trunk=M(0x60432b),leaf=M(0x17452d),leaf2=M(0x2b633a),wall=M(0xd7c59b),roof=M(0x914b37),wood=M(0x79512e),metal=M(0x9aaab0);
function cube(p,x,y,z,a,b,c,m){let o=new THREE.Mesh(new THREE.BoxGeometry(a,b,c),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;p.add(o);return o}
let ground=new THREE.Mesh(new THREE.PlaneGeometry(220,220),grass);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
for(let i=0;i<130;i++){let x=(Math.random()-.5)*100,z=(Math.random()-.5)*100;if(Math.hypot(x,z)<12)continue;let h=.4+Math.random();let t=new THREE.Mesh(new THREE.ConeGeometry(.2,h,5),M(0x496a38));t.position.set(x,h/2,z);scene.add(t)}
let trees=[],houses=[],chests=[],npcs=[];
function tree(x,z){let g=new THREE.Group();g.position.set(x,0,z);let t=new THREE.Mesh(new THREE.CylinderGeometry(.2,.3,2,6),trunk);t.position.y=1;g.add(t);for(let j=0;j<3;j++){let c=new THREE.Mesh(new THREE.IcosahedronGeometry(1.25-j*.17,0),j===1?leaf2:leaf);c.position.y=2.4+j*.65;c.castShadow=true;g.add(c)}scene.add(g);trees.push({g,x,z,hp:3})}
for(let i=0;i<35;i++){let x=(Math.random()-.5)*75,z=(Math.random()-.5)*75;if(Math.hypot(x,z)>12)tree(x,z)}
function house(x,z){let g=new THREE.Group();g.position.set(x,0,z);cube(g,0,1.3,0,5,2.6,4,wall);let r=new THREE.Mesh(new THREE.ConeGeometry(3.7,2,4),roof);r.rotation.y=Math.PI/4;r.position.y=3.5;g.add(r);cube(g,0,.85,2.03,.9,1.7,.12,trunk);scene.add(g);houses.push({g,x,z})}
house(10,-8);house(18,-3);house(-13,-14);house(-18,8);
function chest(x,z){let g=new THREE.Group();cube(g,0,.4,0,1.1,.8,.8,wood);cube(g,0,.84,0,1.15,.15,.85,metal);g.position.set(x,0,z);scene.add(g);chests.push({g,x,z,open:false})}chest(7,-5);chest(-8,5);chest(20,5);
function person(x,z,name,color){let g=new THREE.Group();cube(g,0,1,0,.7,1,.45,M(color));let h=new THREE.Mesh(new THREE.SphereGeometry(.38,12,10),M(0xc58b65));h.position.y=1.8;g.add(h);scene.add(g);npcs.push({g,x,z,name,p:Math.random()*7})}person(3,-3,'سالم',0x245b8a);person(-5,-7,'خالد',0x267253);person(14,2,'حارس القرية',0x675342);
let player=new THREE.Group();scene.add(player);cube(player,0,1,0,.8,1.1,.5,M(0x087b58));let head=new THREE.Mesh(new THREE.SphereGeometry(.43,16,12),M(0xb87953));head.position.y=1.95;player.add(head);cube(player,0,.4,0,.65,.65,.42,M(0x26333d));player.position.set(0,0,3);
let gold=120,woodCount=0,hp=100,weapon='sword',running=false,keys={},joy={x:0,y:0},jumpY=0;
function notify(s){let e=document.querySelector('#toast');e.textContent=s;e.style.opacity=1;clearTimeout(notify.t);notify.t=setTimeout(()=>e.style.opacity=0,1600)}
function update(){document.querySelector('#gold').textContent=gold;document.querySelector('#wood').textContent=woodCount;document.querySelector('#hp').textContent=hp;document.querySelector('#progress').textContent=woodCount+' / 5';document.querySelector('#mission').textContent=woodCount>=5?'اكتملت المهمة! استكشف القرية':'اجمع 5 وحدات خشب'}
function nearest(a){return a.map(o=>[o,Math.hypot(player.position.x-o.x,player.position.z-o.z)]).sort((a,b)=>a[1]-b[1])[0]||[null,99]}
window.choose=w=>{weapon=w;document.querySelectorAll('.slot').forEach((e,i)=>e.classList.toggle('active',['sword','axe','bow','potion'][i]===w));notify('السلاح: '+w)}
window.attack=()=>{if(weapon==='axe'){let [t,d]=nearest(trees);if(t&&d<4){if(--t.hp<=0){t.g.visible=false;woodCount+=3;update();notify('قطعت الشجرة +3 خشب')}else notify('ضربة بالفأس');return}}if(weapon==='potion'){hp=Math.min(100,hp+30);update();notify('استعدت الصحة');return}notify(weapon==='bow'?'أطلقت سهماً':'هاجمت بالسيف')}
window.interact=()=>{let [c,d]=nearest(chests);if(c&&d<3&&!c.open){c.open=true;c.g.visible=false;gold+=35;update();notify('غنمت 35 ذهباً');return}let [h,hd]=nearest(houses);if(h&&hd<5){gold+=20;update();notify('دخلت البيت وجمعت 20 ذهباً');return}let [n,nd]=nearest(npcs);if(n&&nd<3){notify(n.name+': مرحباً بك!');return}notify('اقترب من بيت أو صندوق أو شخصية')}
window.zoom=d=>camera.position.multiplyScalar(d>0?.85:1.18);window.toggleRun=()=>running=!running;window.jump=()=>{jumpY=.8;setTimeout(()=>jumpY=0,350)};window.toggleHud=()=>document.querySelectorAll('.hud,.tools,.bottom').forEach(e=>e.style.display=e.style.display==='none'?'':'none');
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')attack();if(e.key.toLowerCase()==='e')interact();if('1234'.includes(e.key))choose(['sword','axe','bow','potion'][+e.key-1])});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let active=false,stick=document.querySelector('#stick'),knob=document.querySelector('#knob');stick.addEventListener('pointerdown',e=>{active=true;stick.setPointerCapture(e.pointerId);joyMove(e)});stick.addEventListener('pointermove',e=>active&&joyMove(e));stick.addEventListener('pointerup',()=>{active=false;joy={x:0,y:0};knob.style.transform='translate(0,0)'});function joyMove(e){let r=stick.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,l=Math.hypot(x,y),k=Math.min(1,34/(l||1));joy={x:x/(l||1)*k,y:y/(l||1)*k};knob.style.transform='translate('+joy.x*27+'px,'+joy.y*27+'px)'}
let yaw=0;const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.04),x=(keys.d?1:0)-(keys.a?1:0)+joy.x,z=(keys.s?1:0)-(keys.w?1:0)+joy.y,l=Math.hypot(x,z);if(l>.08){x/=Math.max(1,l);z/=Math.max(1,l);player.position.x+=x*(running||keys.shift?8:4.5)*dt;player.position.z+=z*(running||keys.shift?8:4.5)*dt;player.rotation.y=Math.atan2(x,z);yaw=player.rotation.y}player.position.y=jumpY;npcs.forEach(n=>{n.p+=dt;n.g.position.x=n.x+Math.sin(n.p)*1.8;n.g.position.z=n.z+Math.cos(n.p*.7)*1.5;n.g.rotation.y=Math.sin(n.p)*.4});let target=new THREE.Vector3(player.position.x,2.4,player.position.z),desired=new THREE.Vector3(player.position.x+Math.sin(yaw)*9,6.5,player.position.z+Math.cos(yaw)*9);camera.position.lerp(desired,.08);camera.lookAt(target);renderer.render(scene,camera)}loop();camera.position.set(0,7,12);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});update();
</script></body></html>
