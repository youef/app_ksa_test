name: District picker UX checks

on:
  pull_request:
    paths:
      - 'app/districts.tsx'
      - 'tests/districtsPickerDesign.test.cjs'
      - 'docs/design/districts-picker-ux-20261121-1512.md'
      - 'lib/saudiLocations.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    name: District picker TypeScript, Web and focused tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run export:web
      - run: node --test tests/districtsPickerDesign.test.cjs
