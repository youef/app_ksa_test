name: HAYNA AI · Engineering Audit
on:
  schedule:
    - cron: "13 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: hayna-ai-audit
  cancel-in-progress: false
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit TypeScript, web build and native/OTA readiness
        id: audit
        continue-on-error: true
        env:
          HAYNA_SUPABASE_URL: ${{ vars.HAYNA_SUPABASE_URL }}
          HAYNA_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.HAYNA_SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/hayna-ai-audit.mjs
      - name: Upload engineering report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hayna-ai-report
          path: artifacts/hayna-agent-report.*
          if-no-files-found: warn
          retention-days: 30
      - name: Create or update an actionable issue
        if: steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title="HAYNA AI: engineering checks failed"
          number="$(gh issue list --state open --search 'in:title HAYNA AI: engineering checks failed' --json number,title --jq '.[] | select(.title == "HAYNA AI: engineering checks failed") | .number' | head -n 1)"
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file artifacts/hayna-agent-report.md
          else
            gh issue create --title "$title" --body-file artifacts/hayna-agent-report.md
          fi
      - name: Mark job failed if diagnostics failed
        if: steps.audit.outcome == 'failure'
        run: exit 1
