name: Native map UX checks

on:
  pull_request:
    paths:
      - "app/map.tsx"
      - "tests/mapNativeLayout.test.cjs"
      - "docs/design/native-map-ux-2026-11-20.md"
      - ".github/workflows/native-map-ux.yml"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: native-map-ux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript, Web export and UI tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Expo Web build and metadata checks
        run: npm run build
      - name: Native map layout regression
        run: node --test tests/mapNativeLayout.test.cjs
