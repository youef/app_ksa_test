name: Build Hayna Android APK / iOS IPA

# Manual GitHub Actions fallback. EAS Workflows in .eas/workflows/
# can be run from Expo without adding a GitHub EXPO_TOKEN.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Which app binary should be built?"
        required: true
        default: both
        type: choice
        options:
          - both
          - android
          - ios

permissions:
  contents: read

jobs:
  android:
    name: Android APK (preview)
    if: ${{ inputs.platform == 'both' || inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CI: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Verify Expo access
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is missing. Add it in Settings > Secrets and variables > Actions, or run .eas/workflows/mobile-builds.yml from Expo."
            exit 1
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Android APK on EAS
        run: npx --yes eas-cli@latest build --platform android --profile preview --non-interactive --wait
      - name: Download APK from Expo
        if: ${{ success() }}
        run: echo "Open https://expo.dev/accounts/yousefalhazmi/projects/hayna/builds to download the signed Android APK."

  ios:
    name: iOS IPA (TestFlight / store)
    if: ${{ inputs.platform == 'both' || inputs.platform == 'ios' }}
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CI: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Verify Expo access
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is missing. Add it in Settings > Secrets and variables > Actions, or run .eas/workflows/mobile-builds.yml from Expo."
            exit 1
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build signed iOS IPA on EAS (no auto-submit)
        run: npx --yes eas-cli@latest build --platform ios --profile testflight --non-interactive --wait
      - name: Download IPA from Expo
        if: ${{ success() }}
        run: echo "Open https://expo.dev/accounts/yousefalhazmi/projects/hayna/builds to download the signed iOS IPA. Submission to TestFlight is a separate step."
