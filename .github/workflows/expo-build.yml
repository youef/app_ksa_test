name: Build Hayna Android APK / iOS IPA

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Which app binary should be built?"
        required: true
        default: both
        type: choice
        options:
          - both
          - android
          - ios

permissions:
  contents: read

jobs:
  native-setup:
    name: Check signed mobile build setup
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.expo-token.outputs.configured }}
    steps:
      - name: Check Expo credential availability
        id: expo-token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::EXPO_TOKEN is missing. Signed app builds are skipped."
          fi

  web:
    name: Validate Web Export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hayna-web
          path: dist

  android:
    name: Android APK (preview)
    needs: native-setup
    if: ${{ needs.native-setup.outputs.configured == 'true' && (inputs.platform == 'both' || inputs.platform == 'android') }}
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CI: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build Android APK on EAS
        run: npx --yes eas-cli@latest build --platform android --profile preview --non-interactive --wait

  ios:
    name: iOS IPA (TestFlight)
    needs: native-setup
    if: ${{ needs.native-setup.outputs.configured == 'true' && (inputs.platform == 'both' || inputs.platform == 'ios') }}
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CI: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build iOS on EAS
        run: npx --yes eas-cli@latest build --platform ios --profile testflight --non-interactive --wait
