name: Build & Release Mobile Apps (APK & iOS)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  web:
    name: Build Web Export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npx expo export -p web
      - uses: actions/upload-artifact@v4
        with:
          name: hayna-web
          path: dist

  eas-build:
    name: Build Android APK & iOS TestFlight
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install
      - name: Setup EAS CLI
        if: ${{ env.EXPO_TOKEN != '' }}
        run: npm install -g eas-cli

      - name: Explain skipped mobile build when EAS token is missing
        if: ${{ env.EXPO_TOKEN == '' }}
        run: echo "EXPO_TOKEN is not configured; skipping Android/iOS builds. Web export remains independent."

      - name: Build Android APK with EAS
        if: ${{ env.EXPO_TOKEN != '' }}
        run: |
          set -euo pipefail
          eas build --platform android --profile preview --non-interactive --wait 2>&1 | tee eas-android.log
          APK_URL=$(grep -Eo 'https://expo\.dev/artifacts/eas/[^[:space:]]+\.apk([?][^[:space:]]*)?' eas-android.log | tail -1 || true)
          if [ -z "$APK_URL" ]; then
            echo "::error::EAS finished but no APK artifact URL was found."
            exit 1
          fi
          curl -fL "$APK_URL" -o hayna-release.apk
          test -s hayna-release.apk

      - name: Build iOS production IPA and submit to TestFlight
        if: ${{ env.EXPO_TOKEN != '' }}
        run: |
          set -euo pipefail
          echo "Building production iOS app and submitting to TestFlight..."
          eas build --platform ios --profile production --auto-submit --non-interactive --wait 2>&1 | tee eas-ios.log
          IPA_URL=$(grep -Eo 'https://expo\.dev/artifacts/eas/[^[:space:]]+\.ipa([?][^[:space:]]*)?' eas-ios.log | tail -1 || true)
          if [ -n "$IPA_URL" ]; then
            echo "Downloading IPA artifact..."
            curl -fL "$IPA_URL" -o hayna-release.ipa
            test -s hayna-release.ipa
          else
            echo "No IPA URL was printed; the build may still have been submitted successfully to TestFlight."
          fi

      - name: Upload Android APK artifact
        if: ${{ env.EXPO_TOKEN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: hayna-android-apk
          path: hayna-release.apk
          if-no-files-found: error

      - name: Upload iOS IPA artifact
        if: ${{ env.EXPO_TOKEN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: hayna-ios-ipa
          path: hayna-release.ipa
          if-no-files-found: ignore

      - name: Create GitHub Release
        if: ${{ env.EXPO_TOKEN != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-beta.${{ github.run_number }}
          name: "حيّنا - Hayna App v1.0.0 Beta #${{ github.run_number }}"
          generate_release_notes: true
          files: |
            hayna-release.apk
            hayna-release.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
