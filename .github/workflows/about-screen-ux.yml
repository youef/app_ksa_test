name: About screen UX checks

on:
  pull_request:
    paths:
      - "app/about.tsx"
      - "tests/aboutScreenDesign.test.cjs"
      - "docs/design/about-screen-ux-2026-11-23.md"
      - ".github/workflows/about-screen-ux.yml"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: about-screen-ux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: About TypeScript, Web export and focused tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Expo Web export
        run: npm run export:web
      - name: About screen UX regression
        run: node --test tests/aboutScreenDesign.test.cjs
