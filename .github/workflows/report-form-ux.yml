name: Report form UX checks

on:
  pull_request:
    paths:
      - 'app/report.tsx'
      - 'tests/reportDesign.test.cjs'
      - 'docs/design/report-form-ux-2026-11-22.md'
      - '.github/workflows/report-form-ux.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    name: Report form TypeScript, Web and focused tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run export:web
      - run: node --test tests/reportDesign.test.cjs
