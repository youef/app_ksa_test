name: Rate app design checks

on:
  pull_request:
    branches: [main]
    paths:
      - app/rate-app.tsx
      - tests/rateAppDesign.test.cjs
      - docs/design/rate-app-ux-2026-11-22.md
      - .github/workflows/rate-app-design.yml
  push:
    branches:
      - 'design/rate-app-ux-*'

permissions:
  contents: read

jobs:
  rating-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify rating-screen UX contract
        run: node --test tests/rateAppDesign.test.cjs
      - name: TypeScript
        run: npm run typecheck
      - name: Expo Web export
        run: npm run export:web
