name: Marketplace integration safety

on:
  pull_request:
    paths: ['app/**', 'components/**', 'lib/**', 'supabase/functions/**', 'supabase/migrations/**', 'artifacts/market*.sql', 'artifacts/neighbor*.sql', 'artifacts/business-archive.sql', 'tests/*.cjs', 'package-lock.json', '.github/workflows/marketplace-checks.yml']
  push:
    branches: [main, codex/hayna-full-integration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payment-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify full local suite, privacy, publishing and payment callbacks
        run: node --test --test-concurrency=2 tests/*.test.cjs
