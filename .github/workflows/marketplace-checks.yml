name: Marketplace payment safety

on:
  pull_request:
    paths: ['supabase/functions/**', 'supabase/migrations/**', 'artifacts/marketplace-*.sql', 'lib/marketplaceWorkspace.ts', 'tests/marketplace*.cjs', 'tests/databaseHarness.cjs', 'package-lock.json', '.github/workflows/marketplace-checks.yml']
  push:
    branches: [main, codex/hayna-full-integration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payment-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify RLS, atomic payment and untrusted provider callbacks
        run: node --test tests/marketplaceWorkspace.database.test.cjs tests/marketplaceWorkspace.test.cjs tests/marketplaceWebhooks.test.cjs
