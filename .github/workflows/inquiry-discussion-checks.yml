name: Inquiry discussion checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify hourly agent script syntax
        run: |
          node --check scripts/hayna-ai-audit.mjs
          node --check scripts/hayna-ai-advisor.mjs
          node --check scripts/hayna-ai-recover-install.mjs
      - name: Verify CI least-privilege regression
        run: node --test tests/workflowLeastPrivilege.test.cjs
      - name: Verify web response security headers
        run: node --test tests/vercelSecurityHeaders.test.cjs
      - name: TypeScript check
        run: npm run typecheck

  platform-bundles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Export web bundle
        run: npx expo export --platform web --output-dir dist-web
      - name: Export Android JS bundle
        run: npx expo export --platform android --output-dir dist-android
      - name: Export iOS JS bundle
        run: npx expo export --platform ios --output-dir dist-ios
