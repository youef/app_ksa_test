name: Inquiry discussion checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify hourly agent script syntax
        run: |
          node --check scripts/hayna-ai-audit.mjs
          node --check scripts/hayna-ai-advisor.mjs
          node --check scripts/hayna-ai-recover-install.mjs
      - name: TypeScript check
        run: npm run typecheck

  platform-bundles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Export web bundle
        run: npx expo export --platform web --output-dir dist-web
      - name: Export Android JS bundle
        run: npx expo export --platform android --output-dir dist-android
      - name: Export iOS JS bundle
        run: npx expo export --platform ios --output-dir dist-ios
