name: Profile connections skeleton UX checks

on:
  pull_request:
    paths:
      - components/profile/ProfileConnections.tsx
      - tests/profileConnectionsDesign.test.cjs
      - .github/workflows/profile-connections-design-checks.yml
  push:
    branches:
      - design/profile-connections-skeleton-20261125
    paths:
      - components/profile/ProfileConnections.tsx
      - tests/profileConnectionsDesign.test.cjs
      - .github/workflows/profile-connections-design-checks.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run export:web
      - run: node --test tests/profileConnectionsDesign.test.cjs
