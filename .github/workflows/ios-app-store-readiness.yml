name: iOS App Store readiness
on:
  pull_request:
    paths:
      - app/privacy.tsx
      - app/terms.tsx
      - app/_layout.tsx
      - app.json
      - eas.json
      - package.json
      - tests/iosAppStoreReadiness.test.cjs
      - scripts/check-ios-app-icon.cjs
      - lib/logrocket.native.ts
      - lib/logrocket.web.ts
      - lib/logrocket.ts
      - lib/telemetryConsent.ts
      - docs/ios-app-store-readiness-2026-11-24.md
      - .github/workflows/ios-app-store-readiness.yml
  push:
    branches:
      - compliance/ios-app-store-readiness-20261124
jobs:
  ios-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Focused iOS compliance checks
        run: node --test tests/iosAppStoreReadiness.test.cjs
      - name: TypeScript
        run: npm run typecheck
      - name: Expo Web export
        run: npx expo export --platform web --output-dir dist/web-check
      - name: Expo iOS JavaScript bundle export
        run: npx expo export --platform ios --output-dir dist/ios-js-check
      - name: Generate native iOS project and AppIcon assets
        run: npx expo prebuild --platform ios --no-install --clean
      - name: Verify App Store icon dimensions and alpha channel
        run: node scripts/check-ios-app-icon.cjs
