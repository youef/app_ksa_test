name: Deploy حيّنا to Vercel

on:
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel production settings
        run: npx vercel@latest pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_Sq5UAjTQnk2cEUHVGF5XRja3
          VERCEL_PROJECT_ID: prj_K1yWWRZF69dgO7TIJLaLIQnTp5VV

      - name: Build for production
        run: npx vercel@latest build --prod
        env:
          VERCEL_ORG_ID: team_Sq5UAjTQnk2cEUHVGF5XRja3
          VERCEL_PROJECT_ID: prj_K1yWWRZF69dgO7TIJLaLIQnTp5VV

      - name: Deploy prebuilt output
        run: npx vercel@latest deploy --prebuilt --prod --yes
        env:
          VERCEL_ORG_ID: team_Sq5UAjTQnk2cEUHVGF5XRja3
          VERCEL_PROJECT_ID: prj_K1yWWRZF69dgO7TIJLaLIQnTp5VV
